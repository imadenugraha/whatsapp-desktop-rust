name: whatsapp-desktop
title: WhatsApp Desktop
base: core24
version: '0.3.0'
summary: Unofficial lightweight desktop wrapper for WhatsApp Web
description: |
  Standalone window for WhatsApp Web built with Rust and the system webview.
  No telemetry. Not affiliated with WhatsApp or Meta.
grade: stable
confinement: strict

apps:
  whatsapp-desktop:
    command: bin/whatsapp-desktop
    extensions: [gnome]
    desktop: usr/share/applications/whatsapp-desktop.desktop
    plugs:
      - network
      - audio-playback
      - audio-record
      - camera
      - home
      - removable-media
      - desktop-legacy
      - unity7

parts:
  app:
    plugin: rust
    source: .
    build-packages:
      - pkg-config
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libssl-dev
      - libdbus-1-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libdbus-1-3
    override-prime: |
      craftctl default
      install -Dm644 $CRAFT_PROJECT_DIR/packaging/whatsapp-desktop.desktop $CRAFT_PRIME/usr/share/applications/whatsapp-desktop.desktop
